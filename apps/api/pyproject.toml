[project]
name = "stagevote-api"
version = "0.1.0"
description = "StageVote live event voting: API, domain logic, migrations and background worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.149,<0.150",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy[asyncio]>=2.1.5,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<1.21",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "argon2-cffi>=25.1,<26",
    "cryptography>=50,<51",
    "pillow>=13,<14",
    "jinja2>=3.1,<4",
    "aiosmtplib>=5.1,<6",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.32,<0.1",
    "google-auth>=2.62,<3",
    "google-api-python-client>=2.201,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[project.scripts]
stagevote = "stagevote.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stagevote"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random is only used for jitter, never for secrets
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "RUF012",
    "E501",   # the formatter wraps code; long user-facing strings stay readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
# Migrations interpolate only the runtime role name, checked to be alphanumeric first.
"alembic/**" = ["E501", "S608"]
# These modules interpolate only whitelisted SQL fragments (status filters, constants);
# every user-supplied value is a bound parameter.
"src/stagevote/api/admin_participants.py" = ["S608"]
"src/stagevote/mailer/delivery.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
packages = ["stagevote"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
