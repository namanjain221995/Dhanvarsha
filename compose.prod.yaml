# Production example: HTTPS via Caddy (automatic certificates), persistent volumes,
# no published database or test inbox, explicit email configuration.
#
#   cp .env.example .env   # then set the production values described in docs/operations.md
#   docker compose -f compose.prod.yaml up -d --build
#
# For the Gmail API provider also layer compose.gmail.yaml, which mounts the service-account
# key read-only as a Docker secret:
#   docker compose -f compose.prod.yaml -f compose.gmail.yaml up -d
name: stagevote

x-api-env: &api-env
  APP_ENV: production
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to https://your-domain}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY}
  PROGRAMME_TIMEZONE: ${PROGRAMME_TIMEZONE:-Asia/Kolkata}
  PRODUCT_NAME: ${PRODUCT_NAME:-StageVote}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (runtime role)}
  DB_APP_ROLE: ${DB_APP_ROLE:-stagevote_app}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  VOTE_LOCK_TIMEOUT_MS: ${VOTE_LOCK_TIMEOUT_MS:-5000}
  PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-8}
  EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
  INVITATION_ENCRYPTION_KEY: ${INVITATION_ENCRYPTION_KEY:?set INVITATION_ENCRYPTION_KEY}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
  DEVICE_COOKIE_DAYS: ${DEVICE_COOKIE_DAYS:-180}
  INVITATION_RETRY_HOURS: ${INVITATION_RETRY_HOURS:-72}
  LOGIN_FAILURES_PER_IP: ${LOGIN_FAILURES_PER_IP:-1000}
  LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-600}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:?set EMAIL_PROVIDER to smtp or gmail_workspace}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-30}
  GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
  GOOGLE_WORKSPACE_SENDER: ${GOOGLE_WORKSPACE_SENDER:-}
  EMAIL_MAX_PER_MINUTE: ${EMAIL_MAX_PER_MINUTE:-60}
  EMAIL_CONCURRENCY: ${EMAIL_CONCURRENCY:-4}
  EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-6}
  MAILPIT_UI_URL: ""
  MEDIA_ROOT: /data/media
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
  MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-0}
  MAX_MEDIA_IMAGE_BYTES: ${MAX_MEDIA_IMAGE_BYTES:-0}
  GALLERY_MODEL_URL: ${GALLERY_MODEL_URL:-}
  GALLERY_MODEL_NAME: ${GALLERY_MODEL_NAME:-Qwen/Qwen3.6-35B-A3B-NVFP4}
  GALLERY_MAX_IMAGE_BYTES: ${GALLERY_MAX_IMAGE_BYTES:-0}
  GALLERY_MAX_VIDEO_BYTES: ${GALLERY_MAX_VIDEO_BYTES:-0}
  GALLERY_MAX_PERSON_BYTES: ${GALLERY_MAX_PERSON_BYTES:-0}
  GALLERY_UPLOADS_PER_HOUR: ${GALLERY_UPLOADS_PER_HOUR:-0}
  GALLERY_FREE_SPACE_RESERVE_BYTES: ${GALLERY_FREE_SPACE_RESERVE_BYTES:-21474836480}
  GALLERY_MIN_CONCURRENCY: ${GALLERY_MIN_CONCURRENCY:-2}
  GALLERY_MAX_CONCURRENCY: ${GALLERY_MAX_CONCURRENCY:-16}
  GALLERY_READER_THREADS: ${GALLERY_READER_THREADS:-8}
  GALLERY_S3_BUCKET: ${GALLERY_S3_BUCKET:-}
  GALLERY_S3_REGION: ${GALLERY_S3_REGION:-us-east-1}
  GALLERY_S3_PREFIX: ${GALLERY_S3_PREFIX:-}
  GALLERY_S3_URL_HOURS: ${GALLERY_S3_URL_HOURS:-12}
  GALLERY_MAX_TOTAL_BYTES: ${GALLERY_MAX_TOTAL_BYTES:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Only the API and the gallery worker use S3, so only they get the key.
x-s3-key: &s3-key
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:17.11-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      STAGEVOTE_DB_NAME: stagevote
      STAGEVOTE_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      STAGEVOTE_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # No published port: only the API, worker and migrations reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stagevote"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: ./apps/api
    image: stagevote-api:${STAGEVOTE_VERSION:-local}
    environment:
      <<: *api-env
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?set DATABASE_MIGRATION_URL (owner role)}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    command: ["stagevote", "bootstrap"]
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: stagevote-api:${STAGEVOTE_VERSION:-local}
    restart: always
    environment:
      <<: [*api-env, *s3-key]
    command:
      - uvicorn
      - stagevote.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${API_WORKERS:-6}
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-access-log
      - --timeout-graceful-shutdown=20
      # Longer than Caddy keeps an idle connection (2 minutes), so Caddy always closes first and never sends
      # a request down a connection this end has just closed, which reached the browser as a 502.
      - --timeout-keep-alive=130
    # An organiser's analysis view asks the vision model on this machine what a file shows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 10

  worker:
    image: stagevote-api:${STAGEVOTE_VERSION:-local}
    restart: always
    environment: *api-env
    command: ["stagevote", "worker"]
    stop_grace_period: 30s
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Reads the faces in the photo gallery's files, apart from the worker above. Run exactly one: it scales
  # itself with the queue (worker/gallery.py). The low CPU priority gives way to the voting and to anything
  # else on this machine, so it only uses idle cores. It reaches the vision model on this machine through
  # GALLERY_MODEL_URL, and works without it.
  gallery-worker:
    image: stagevote-api:${STAGEVOTE_VERSION:-local}
    restart: always
    environment:
      <<: [*api-env, *s3-key]
    command: ["stagevote", "gallery-worker"]
    stop_grace_period: 30s
    cpus: ${GALLERY_WORKER_CPUS:-12}
    cpu_shares: 256
    mem_limit: ${GALLERY_WORKER_MEMORY:-8g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    image: stagevote-web:${STAGEVOTE_VERSION:-local}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Pages load the gallery's full-size files straight from this bucket.
      GALLERY_S3_BUCKET: ${GALLERY_S3_BUCKET:-}
      GALLERY_S3_REGION: ${GALLERY_S3_REGION:-us-east-1}
    depends_on:
      - api

  proxy:
    image: caddy:2.11.7-alpine
    restart: always
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. vote.example.org}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
      WEB_UPSTREAM: web:3000
      API_UPSTREAM: api:8000
    # Caddyfile.prod for a domain; Caddyfile.ip when the site is reached by its IP address.
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-Caddyfile.prod}", "--adapter", "caddyfile"]
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # 127.0.0.1 behind a Cloudflare Tunnel (only cloudflared reaches the proxy then).
      - "${PROXY_BIND:-0.0.0.0}:80:80"
      - "${PROXY_BIND:-0.0.0.0}:443:443"
      - "${PROXY_BIND:-0.0.0.0}:443:443/udp"
    depends_on:
      - api
      - web

  # Cloudflare Tunnel connector: enabled with COMPOSE_PROFILES=tunnel in .env
  # (scripts/deploy.sh --domain <host> --tunnel). The token comes from the Cloudflare
  # dashboard (Zero Trust > Networks > Tunnels) and stays in .env only.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: always
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
